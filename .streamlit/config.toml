[theme]
base = "light"
primaryColor = "#13262d"
backgroundColor = "#f3f5f4"
secondaryBackgroundColor = "#e6ecea"
textColor = "#13262d"
font = "Noto Naskh Arabic:https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;600&display=swap"
headingFont = "Reem Kufi:https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;600&display=swap"
baseFontSize = 16
borderColor = "#d9e1df"
showWidgetBorder = true
baseRadius = "small"
chartCategoricalColors = ["#0c7c84", "#13262d", "#d4521c"]

[theme.sidebar]
backgroundColor = "#13262d"
secondaryBackgroundColor = "#1f3640"
textColor = "#e9efee"
primaryColor = "#7fd1d6"
borderColor = "#2b4550"

[browser]
gatherUsageStats = false
